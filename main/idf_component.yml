dependencies:
  idf:
    version: ">=5.5.0"
  # LittleFS for the trip-history store (real folders /trips/<id>/, power-loss
  # safe, good for many small log files). Mounted on the "storage" partition.
  joltwallet/littlefs:
    version: "^1.14.0"

# Removed with the Android Auto stack — do not re-add unless AA comes back:
#   espressif/esp_hosted        P4 had no radio; the C6 was the Wi-Fi/BT
#                               co-processor. ESP32-S3 / ESP32 have their own,
#                               so esp_wifi and the NimBLE controller are native.
#   espressif/esp_wifi_remote   same reason.
#   espressif/esp_h264          software H.264 decoder for the AA video channel.
#   espressif/esp_image_effects I420 -> RGB565 for the AA video sink (PIE
#                               instructions, P4-only anyway).
#   espressif/esp-serial-flasher reflashed the external BT-agent module.
#
# The display stack (esp_lvgl_adapter, esp_lcd_touch_gt911, the panel driver)
# used to be pulled in transitively by the P4 BSP. Whichever bsp_board
# implementation you write must declare its own panel/touch dependencies here
# or in its own idf_component.yml — see components/bsp_board/README.md.
